# 龙珠车服开发环境：按域名转发到本机两端（管理端 8080、用户端 8081）。
# 装到 /etc/nginx/conf.d/longzhu-dev.conf，nginx -t 后 reload。
# 域名解析生效、证书就绪后再加 443 并把 80 跳 443（见 docs/longzhu.md）。
server {
    listen 80;
    server_name dev.admin.bgssai-insurance.com;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dev.user.bgssai-insurance.com;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
